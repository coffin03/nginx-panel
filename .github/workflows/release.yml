name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-exe:
    name: 构建 Windows 便携版并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt pyinstaller pytest

      - name: 运行测试
        run: python -m pytest -q

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 打包 exe
        run: python -m PyInstaller --noconfirm --clean packaging/nginx-panel.spec

      - name: 生成压缩包与校验值
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $stage = Join-Path $env:RUNNER_TEMP 'nginx-panel'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'dist/nginx-panel.exe' $stage
          Copy-Item 'LICENSE' (Join-Path $stage 'LICENSE.txt')
          $zip = "dist/nginx-panel-$version-win64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  nginx-panel-$version-win64.zip" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          gh release create $env:RELEASE_TAG `
            "dist/nginx-panel-$version-win64.zip" `
            "dist/SHA256SUMS.txt" `
            --title "nginx-panel $env:RELEASE_TAG" `
            --generate-notes `
            --verify-tag