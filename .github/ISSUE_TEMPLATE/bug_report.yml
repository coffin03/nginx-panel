name: Bug 反馈
description: 报告可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先搜索是否已有相同 Issue；安全问题请走 SECURITY.md 中的私密渠道。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 实际发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 添加实例 …
        2. 打开 …
        3. 点击 …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 版本与环境
      placeholder: 0.1.0 · Windows 11 / Ubuntu 22.04 · 运行模式 local/systemd
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: 数据目录下 logs/app.log 的相关片段，或浏览器控制台报错
      render: shell
    validations:
      required: false